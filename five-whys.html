<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Whys AI Coach · TAQA LEAD</title>
<style>
:root{--teal:#0F6E56;--teal-lt:#D6F0E8;--teal-xl:#EEF8F4;--orange:#E87722;--orange-lt:#FEF3EA;--dark:#1A1A2E;--mid:#3D3D3D;--light:#777;--grey:#F4F5F7;--border:#E2E5E8;--white:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--grey);color:var(--mid);height:100vh;display:flex;flex-direction:column;}
header{background:var(--dark);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.badge{background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.06em;}
header h1{color:#fff;font-size:17px;font-weight:600;flex:1;}
.header-tag{color:#aaa;font-size:12px;}
.main{display:flex;flex:1;overflow:hidden;}
.chain-panel{width:260px;background:#fff;border-right:2px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.chain-header{padding:14px 16px;background:var(--teal);color:#fff;}
.chain-header h3{font-size:14px;font-weight:700;}
.chain-header p{font-size:11px;opacity:.8;margin-top:4px;}
.chain-body{padding:12px;flex:1;}
.chain-item{margin-bottom:12px;}
.chain-num{font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.chain-problem{font-size:12px;color:var(--dark);font-weight:600;line-height:1.4;}
.chain-answer{font-size:12px;color:var(--mid);line-height:1.4;margin-top:3px;}
.chain-arrow{text-align:center;color:var(--border);font-size:16px;margin:4px 0;}
.root-cause{background:var(--orange-lt);border:1.5px solid var(--orange);border-radius:8px;padding:12px;}
.root-cause .chain-num{color:var(--orange);}
.root-cause .chain-answer{color:#7D4E00;font-weight:600;}
.chain-empty{color:var(--light);font-size:12px;text-align:center;padding:20px 0;line-height:1.6;}
.export-btn{margin:12px;padding:8px;background:var(--teal-xl);border:1.5px solid var(--teal-lt);border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;color:var(--teal);text-align:center;}
.export-btn:hover{background:var(--teal);color:#fff;}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:80%;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg.assistant{align-self:flex-start;}
.msg.user{align-self:flex-end;}
.msg-bubble{padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;}
.msg.assistant .msg-bubble{background:#fff;border:1.5px solid var(--border);color:var(--dark);border-radius:4px 12px 12px 12px;}
.msg.user .msg-bubble{background:var(--teal);color:#fff;border-radius:12px 4px 12px 12px;}
.msg-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;color:var(--light);}
.msg.user .msg-label{text-align:right;color:var(--teal);}
.typing{display:flex;gap:4px;align-items:center;padding:12px 16px;background:#fff;border:1.5px solid var(--border);border-radius:4px 12px 12px 12px;width:fit-content;}
.typing span{width:7px;height:7px;background:var(--teal);border-radius:50%;animation:bounce .8s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.input-area{padding:12px 16px;background:#fff;border-top:2px solid var(--border);display:flex;gap:10px;}
#problem-section{padding:16px;background:var(--teal-xl);border-bottom:2px solid var(--teal-lt);}
#problem-section h3{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:8px;}
#problem-input{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid var(--teal-lt);font-size:14px;color:var(--dark);resize:none;background:#fff;min-height:60px;}
#problem-start{padding:10px 20px;background:var(--teal);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;}
#problem-start:hover{background:#0d5e49;}
#user-input{flex:1;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;color:var(--dark);resize:none;min-height:42px;max-height:120px;}
#user-input:focus{outline:none;border-color:var(--teal);}
#send-btn{padding:10px 20px;background:var(--teal);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;}
#send-btn:hover{background:#0d5e49;}
#send-btn:disabled{opacity:.4;cursor:not-allowed;}
.complete-banner{background:var(--orange-lt);border:2px solid var(--orange);border-radius:10px;padding:14px 18px;margin:0 16px 12px;}
.complete-banner h3{color:var(--orange);font-size:15px;font-weight:700;margin-bottom:6px;}
.complete-banner p{font-size:13px;color:var(--mid);line-height:1.5;}
.restart-btn{display:inline-block;margin-top:10px;padding:8px 18px;background:var(--teal);border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
footer{text-align:center;padding:8px;font-size:11px;color:var(--light);background:#fff;border-top:1px solid var(--border);}
footer a{color:var(--teal);text-decoration:none;}
</style>
</head>
<body>
<header>
  <span class="badge">T7</span>
  <h1>5 Whys AI Coach</h1>
  <span class="header-tag">TAQA LEAD · Module 2</span>
</header>
<div class="main">
  <div class="chain-panel">
    <div class="chain-header"><h3>Root Cause Chain</h3><p>Builds as you answer each Why</p></div>
    <div class="chain-body" id="chain-body"><div class="chain-empty">Your root cause chain will appear here.</div></div>
    <button class="export-btn" id="export-btn" onclick="exportChain()" style="display:none">⬇ Export Root Cause Chain</button>
  </div>
  <div class="chat-area">
    <div id="problem-section">
      <h3>What is the problem you want to investigate?</h3>
      <textarea id="problem-input" placeholder="Describe the operational problem your team keeps experiencing."></textarea>
      <button id="problem-start" onclick="startAnalysis()">Begin 5 Whys Analysis →</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area" id="input-area" style="display:none;">
      <textarea id="user-input" placeholder="Type your answer…" rows="2" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>
<footer>TAQA LEAD Programme · Module 2 · Built by <a href="#">VectorEd</a></footer>
<script>
const API_ENDPOINT='/api/chat';
let messages=[],whyChain=[],analysisComplete=false,problem='';
const SYSTEM_PROMPT=`You are a 5 Whys facilitation coach for TAQA Transmission operations managers in Abu Dhabi. Guide the user through root cause analysis using the 5 Whys method. Ask one Why at a time. Challenge vague answers like 'human error'. After 4-6 Whys when you reach a genuine root cause, start your message with ROOT CAUSE IDENTIFIED: followed by the root cause, then summarise the chain. Keep responses under 4 sentences. Be direct and operational.`;
async function callClaude(userMessage){
  messages.push({role:'user',content:userMessage});
  showTyping();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:SYSTEM_PROMPT,messages})});
    const data=await res.json();
    hideTyping();
    if(data.error){addMessage('assistant','Error: '+data.error.message);return;}
    const reply=data.content[0].text;
    messages.push({role:'assistant',content:reply});
    addMessage('assistant',reply);
    parseChain(userMessage,reply);
  }catch(e){hideTyping();addMessage('assistant','Connection error: '+e.message);}
}
function parseChain(userMsg,assistantMsg){
  if(whyChain.length===0)whyChain.push({type:'problem',text:problem});
  whyChain.push({type:'why',num:whyChain.length,answer:userMsg});
  if(assistantMsg.includes('ROOT CAUSE IDENTIFIED:')){
    analysisComplete=true;
    const m=assistantMsg.match(/ROOT CAUSE IDENTIFIED:\s*([^\n]+)/);
    if(m)whyChain.push({type:'rootcause',text:m[1].trim()});
    showCompleteBanner();
    document.getElementById('send-btn').disabled=true;
    document.getElementById('export-btn').style.display='block';
  }
  renderChain();
}
function renderChain(){
  const body=document.getElementById('chain-body');
  if(!whyChain.length){body.innerHTML='<div class="chain-empty">Your root cause chain will appear here.</div>';return;}
  let html='';
  whyChain.forEach((item,i)=>{
    if(item.type==='problem'){html+=`<div class="chain-item"><div class="chain-num">THE PROBLEM</div><div class="chain-problem">${item.text}</div></div><div class="chain-arrow">↓</div>`;}
    else if(item.type==='why'){html+=`<div class="chain-item"><div class="chain-num">WHY ${item.num}</div><div class="chain-answer">${item.answer}</div></div>`;if(!whyChain[i+1]||whyChain[i+1].type==='why')html+='<div class="chain-arrow">↓</div>';}
    else if(item.type==='rootcause'){html+=`<div class="chain-arrow">↓</div><div class="root-cause"><div class="chain-num">ROOT CAUSE</div><div class="chain-answer">${item.text}</div></div>`;}
  });
  body.innerHTML=html;
}
let typingEl=null;
function showTyping(){typingEl=document.createElement('div');typingEl.className='msg assistant';typingEl.innerHTML='<div class="msg-label">AI Coach</div><div class="typing"><span></span><span></span><span></span></div>';document.getElementById('messages').appendChild(typingEl);scrollBottom();}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}
function addMessage(role,text){const msgs=document.getElementById('messages');const div=document.createElement('div');div.className=`msg ${role}`;div.innerHTML=`<div class="msg-label">${role==='assistant'?'AI Coach':'You'}</div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>`;msgs.appendChild(div);scrollBottom();}
function scrollBottom(){const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;}
function showCompleteBanner(){const msgs=document.getElementById('messages');const div=document.createElement('div');div.className='complete-banner';div.innerHTML=`<h3>🎯 Root Cause Identified</h3><p>Analysis complete. The chain is saved in the left panel.</p><button class="restart-btn" onclick="restart()">↩ Analyse a new problem</button>`;msgs.appendChild(div);scrollBottom();}
async function startAnalysis(){problem=document.getElementById('problem-input').value.trim();if(!problem){alert('Please describe the problem first.');return;}document.getElementById('problem-section').style.display='none';document.getElementById('input-area').style.display='flex';whyChain=[{type:'problem',text:problem}];renderChain();const initial=`I want to investigate this problem using the 5 Whys method: "${problem}"`;addMessage('user',initial);await callClaude(initial);}
async function sendMessage(){const input=document.getElementById('user-input');const text=input.value.trim();if(!text||analysisComplete)return;input.value='';addMessage('user',text);await callClaude(text);}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function exportChain(){let text='TAQA LEAD 5 Whys Root Cause Chain\n'+'='.repeat(40)+'\n\n';whyChain.forEach(item=>{if(item.type==='problem')text+=`PROBLEM:\n${item.text}\n\n`;else if(item.type==='why')text+=`WHY ${item.num}:\n${item.answer}\n\n`;else if(item.type==='rootcause')text+=`ROOT CAUSE:\n${item.text}\n`;});const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='5whys-analysis.txt';a.click();}
function restart(){messages=[];whyChain=[];analysisComplete=false;problem='';document.getElementById('messages').innerHTML='';document.getElementById('problem-input').value='';document.getElementById('problem-section').style.display='block';document.getElementById('input-area').style.display='none';document.getElementById('send-btn').disabled=false;document.getElementById('export-btn').style.display='none';renderChain();}
</script>
</body>
</html>
